name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore VoiceCtrl.sln

      - name: Test
        run: dotnet test VoiceCtrl.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/VoiceCtrl/VoiceCtrl.csproj -c Release -r win-x64 -p:SelfContained=true -o publish

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath VoiceCtrl-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoiceCtrl-win-x64.zip
          generate_release_notes: true
